apply plugin: 'com.android.application'

android {
    namespace = "com.nexus.lifeos"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.nexus.lifeos"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Real answer to "APK pe tap karne par Update dikhna chahiye":
        // this is genuinely native Android behavior, no server/backend
        // needed for it - Android's own package installer offers
        // "Update" (preserving app data) instead of "Install" ONLY when
        // a newly-tapped APK's versionCode is HIGHER than what's
        // currently installed, with the SAME signing key. This was
        // hardcoded at 1 forever, so every single build looked
        // identical to Android - never triggering the "Update" flow
        // this was asked about. Bumped to 2 here; increment this by at
        // least 1 (and versionName below, for the human-readable
        // number users actually see) before building and sharing each
        // future APK for this to keep working. Signing key note: if
        // this project doesn't yet have its own explicit signingConfig
        // (uses the Android Gradle Plugin's own auto-generated debug
        // keystore by default), that keystore is usually stable across
        // builds on the SAME machine, but switching machines or
        // deleting it produces a different key - Android silently
        // refuses an "update" from a differently-signed APK (shows a
        // signature-conflict install failure instead), so keep building
        // from the same machine/keystore for this to work reliably.
        versionCode 2
        versionName "1.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // Explicit, not just relying on capacitor-android's own transitive
    // dependency on this - Gradle's `implementation` visibility doesn't
    // guarantee that module's OWN dependencies are resolvable symbols
    // for THIS module's own source (MainActivity.java directly imports
    // androidx.activity.EdgeToEdge/SystemBarStyle for the edge-to-edge
    // nav-bar-color fix - see MainActivity.java's own comment).
    implementation "androidx.activity:activity:$androidxActivityVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
