<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>NEXUS — Personal Operating System</title>
    <!-- SVG first for every modern browser (crisp at any tab/bookmark
         size, zero raster artifacts); the 32px PNG right after is only a
         fallback for the handful of browsers that don't support SVG
         favicons at all, not a duplicate of the same asset. -->
    <link rel="icon" type="image/svg+xml" href="/nexus-logo.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0F0F17" />
    <!-- Apple's own PWA meta tags - iOS Safari's "Add to Home Screen" does
         not fully honor the standard manifest.json spec (display mode,
         status bar styling), so these are genuinely required for a real
         standalone, no-browser-chrome launch experience on iOS specifically. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NEXUS" />
    <!-- The standard, non-Apple-prefixed equivalent - what Chrome/Android
         itself reads for the same "launch with no browser chrome" signal;
         Apple's own tags above only cover iOS Safari. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- iOS "Add to Home Screen" - Safari never accepts SVG here, needs a
         real PNG at this exact conventional size. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <style>
        /* The very first thing painted - before React (or even the bundled
           app CSS) has loaded at all. Pixel-matched to
           src/components/AppSplashScreen.jsx (same logo/wordmark/colors/
           animation) so the hand-off from this static markup to that React
           component - once auth/lock state is still resolving after mount -
           is invisible, and the fade-out below (once #app gets real
           content) is the only transition ever visible. Inline, not a
           linked stylesheet: this must apply with zero network round trips
           beyond the HTML document itself. */
        #nexus-boot-splash {
            position: fixed; inset: 0; z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
            background: #0F0F17;
            transition: opacity 0.25s ease;
        }
        #nexus-boot-splash.nexus-boot-splash-hidden { opacity: 0; pointer-events: none; }
        #nexus-boot-splash .nexus-boot-mark { position: relative; width: 72px; height: 72px; display: flex; align-items: center; justify-content: center; }
        #nexus-boot-splash .nexus-boot-glow {
            position: absolute; inset: -14px; border-radius: 24px;
            background: radial-gradient(circle, rgba(99,102,241,0.35) 0%, rgba(99,102,241,0) 70%);
            animation: nexusBootGlow 1.8s ease-in-out infinite;
        }
        #nexus-boot-splash img { width: 64px; height: 64px; object-fit: contain; position: relative; }
        #nexus-boot-splash h1 { font-size: 22px; font-weight: 900; letter-spacing: 1.2px; color: #fff; margin: 0; text-align: center; }
        #nexus-boot-splash p { font-size: 11px; color: #94A3B8; text-transform: uppercase; letter-spacing: 2px; font-weight: 700; margin: 4px 0 0; text-align: center; }
        #nexus-boot-splash .nexus-boot-dots { display: flex; gap: 6px; margin-top: 4px; }
        #nexus-boot-splash .nexus-boot-dots span { width: 6px; height: 6px; border-radius: 50%; background: #818CF8; animation: nexusBootDot 1.2s ease-in-out infinite; }
        #nexus-boot-splash .nexus-boot-dots span:nth-child(2) { animation-delay: 0.15s; }
        #nexus-boot-splash .nexus-boot-dots span:nth-child(3) { animation-delay: 0.3s; }
        @keyframes nexusBootGlow { 0%, 100% { opacity: 0.6; transform: scale(1); } 50% { opacity: 1; transform: scale(1.08); } }
        @keyframes nexusBootDot { 0%, 60%, 100% { opacity: 0.3; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-4px); } }
    </style>
    <script>
        // Runs synchronously, before any CSS paints and before React mounts -
        // this is what eliminates the "flash of wrong theme" on every reload.
        // Without this, the page briefly rendered with no data-theme attribute
        // at all, which falls through to the CSS's default (:root = the night
        // theme's solid, opaque colors) until React's useEffect caught up a
        // moment later and switched to the real theme - that snap from
        // opaque-dark to transparent-glass is exactly what looked like the
        // background "abruptly going dark/muddy" on refresh. React's own
        // effect in DashboardLayout still runs afterwards and keeps handling
        // every *subsequent* theme change (e.g. clicking the theme toggle) -
        // this script only owns the very first paint.
        (function () {
            try {
                var theme = localStorage.getItem('nexus_theme') || 'night';
                document.documentElement.setAttribute('data-theme', theme);
                if (theme === 'dynamic') {
                    var now = new Date();
                    var t = now.getHours() + now.getMinutes() / 60;
                    var phase;
                    if (t >= 4 && t < 6.5) phase = 'dawn';
                    else if (t >= 6.5 && t < 17) phase = 'day';
                    else if (t >= 17 && t < 19.5) phase = 'dusk';
                    else phase = 'night';
                    document.documentElement.setAttribute('data-sky-phase', phase);
                }
            } catch (e) {
                /* localStorage unavailable (rare) - CSS defaults still apply, just without this optimization */
            }

            // The glass cards' CSS intentionally transitions backdrop-filter/
            // box-shadow over 2.5s, so time-of-day changes (e.g. dusk fading
            // into night) blend smoothly instead of snapping. But a CSS
            // transition fires on ANY change to that property - including the
            // very first time the browser resolves it from its default (none)
            // to the real blur/saturate/brightness value on initial load. That
            // made the glass effect visibly fade in from zero over 2.5 seconds
            // on every single page load/refresh, which is exactly what looked
            // like a "flicker" or "jump before settling". This class forces
            // every transition off until React has actually mounted and
            // painted the real UI, then removes itself so all the *intended*
            // runtime transitions (theme toggle, day-to-night fades, etc.)
            // keep working normally afterwards.
            //
            // Removal is tied to React actually inserting content into #app
            // (via MutationObserver) rather than a fixed frame count - the JS
            // bundle still has to load/parse/execute first, which can easily
            // take longer than a couple of animation frames, so a fixed
            // rAF-based delay risked removing this class before React had
            // rendered anything, defeating the point. A short timeout is kept
            // as a safety net in case the observer never fires for any reason.
            var root = document.documentElement;
            root.classList.add('no-initial-transition');

            var removeGuard = function () {
                root.classList.remove('no-initial-transition');
            };

            // Fades out and removes the static boot splash the moment React
            // has painted ANYTHING into #app - including its own first
            // splash-equivalent render (AppSplashScreen.jsx, pixel-matched
            // to this static markup), so the two are visually
            // indistinguishable and there's never a "flash of the real UI
            // underneath, then a splash" or vice versa.
            var hideBootSplash = function () {
                var splash = document.getElementById('nexus-boot-splash');
                if (!splash) return;
                splash.classList.add('nexus-boot-splash-hidden');
                setTimeout(function () {
                    if (splash.parentNode) splash.parentNode.removeChild(splash);
                }, 300);
            };

            var appEl = document.getElementById('app');
            var settled = false;
            var finish = function () {
                if (settled) return;
                settled = true;
                hideBootSplash();
                // A fixed settle window, not just a couple of animation
                // frames - several contexts (weather fetch, cloud sync,
                // audio init) commonly trigger a few quick re-renders in the
                // moment right after the first mount, and transitions
                // re-enabling in the middle of that could still show a
                // brief flicker. 200ms is comfortably past all of that on a
                // local dev server while still being imperceptible as a
                // "delay".
                setTimeout(removeGuard, 200);
            };

            if (appEl && window.MutationObserver) {
                var observer = new MutationObserver(function () {
                    if (appEl.childNodes.length > 0) {
                        observer.disconnect();
                        finish();
                    }
                });
                observer.observe(appEl, { childList: true, subtree: true });
            }
            // Safety net: never leave transitions disabled indefinitely, even
            // if the observer setup above didn't work for some reason.
            setTimeout(finish, 1500);
        })();
    </script>
</head>
<body>
    <!-- Static boot splash - visible from the very first paint, before
         React (or the app's own bundled CSS) has loaded at all. Removed by
         the inline script above the instant #app gets real content. -->
    <div id="nexus-boot-splash">
        <div class="nexus-boot-mark">
            <div class="nexus-boot-glow"></div>
            <img src="/nexus-logo.svg" alt="Nexus" />
        </div>
        <div>
            <h1>NEXUS</h1>
            <p>OS</p>
        </div>
        <div class="nexus-boot-dots"><span></span><span></span><span></span></div>
    </div>

    <!-- React Root Mounting Node -->
    <div id="app"></div>

    <!-- Vite React Entry Point -->
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
