<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Subtle depth on the tile itself - kept low-contrast on purpose so it
         reads as premium glass at 256px but never muddies down to a soft
         gray blob at 32px. -->
    <radialGradient id="tileGrad" cx="32%" cy="24%" r="85%">
      <stop offset="0%" stop-color="#1B1B29"/>
      <stop offset="55%" stop-color="#131320"/>
      <stop offset="100%" stop-color="#0D0D14"/>
    </radialGradient>

    <!-- The one vivid element in the whole mark - indigo to cyan, angled to
         follow the same bottom-left-to-top-right direction as the N's own
         diagonal stroke, so the color and the geometry read as one gesture. -->
    <linearGradient id="markGrad" x1="120" y1="372" x2="392" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <radialGradient id="nodeGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#EAF3FF"/>
      <stop offset="45%" stop-color="#8FA6FF"/>
      <stop offset="100%" stop-color="#5B6EF5"/>
    </radialGradient>

    <!-- Soft, contained glow - a duplicate of the mark blurred behind
         itself, not a filter on the live edges, so the crisp vector stays
         crisp at 32px while still reading as "glowing" at 256px. -->
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feColorMatrix in="blur" type="matrix"
        values="0 0 0 0 0.35  0 0 0 0 0.55  0 0 0 0 0.98  0 0 0 0.55 0"/>
    </filter>

    <linearGradient id="rimLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="tileClip">
      <rect x="52" y="52" width="408" height="408" rx="96"/>
    </clipPath>
  </defs>

  <!-- Canvas background: intentionally none. Fully transparent, so this
       drops cleanly into any OS's own icon mask (circle, squircle, rounded
       square) without ever showing a seam. -->

  <!-- Rounded-square tile - the icon's actual background, distinct from
       the transparent canvas around it. -->
  <rect x="52" y="52" width="408" height="408" rx="96" fill="url(#tileGrad)"/>
  <rect x="52.5" y="52.5" width="407" height="407" rx="95.5" fill="none" stroke="#2A2A3D" stroke-width="1"/>

  <!-- A single quiet highlight along the top edge, inside the clip - the
       one glassmorphism cue this mark needs; kept subtle enough to never
       compete with the node mark itself. -->
  <g clip-path="url(#tileClip)">
    <ellipse cx="230" cy="10" rx="230" ry="90" fill="url(#rimLight)"/>
  </g>

  <!-- Outer network: two satellite nodes with thin connector lines,
       suggesting the hub extends into a larger system beyond the letter
       itself - kept fine and quiet so the core N stays the clear focal
       point. -->
  <g stroke="url(#markGrad)" stroke-opacity="0.55" stroke-width="5" stroke-linecap="round">
    <line x1="160" y1="172" x2="112" y2="126"/>
    <line x1="352" y1="340" x2="400" y2="386"/>
  </g>
  <circle cx="112" cy="126" r="12" fill="url(#nodeGrad)"/>
  <circle cx="400" cy="386" r="12" fill="url(#nodeGrad)"/>

  <!-- The signature mark: an N whose strokes are the connections between
       four hub nodes, not a plain lettershape with circles decorating its
       corners. This is the one bold element in the mark - everything else
       stays quiet around it. -->
  <g filter="url(#softGlow)">
    <path d="M160 340 L160 172 L352 340 L352 172"
      fill="none" stroke="url(#markGrad)" stroke-width="34"
      stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <path d="M160 340 L160 172 L352 340 L352 172"
    fill="none" stroke="url(#markGrad)" stroke-width="34"
    stroke-linecap="round" stroke-linejoin="round"/>

  <!-- The four core hub nodes - larger and brighter than the satellites,
       so the eye reads them as the mark's own primary structure. -->
  <circle cx="160" cy="340" r="24" fill="url(#nodeGrad)"/>
  <circle cx="160" cy="172" r="24" fill="url(#nodeGrad)"/>
  <circle cx="352" cy="340" r="24" fill="url(#nodeGrad)"/>
  <circle cx="352" cy="172" r="24" fill="url(#nodeGrad)"/>

  <!-- A small, bright core at the very center of each node - the one
       repeating detail that reads as "premium" up close at 256px and
       simply reads as a clean highlight at 32px. -->
  <circle cx="153" cy="333" r="6" fill="#F5F9FF"/>
  <circle cx="153" cy="165" r="6" fill="#F5F9FF"/>
  <circle cx="345" cy="333" r="6" fill="#F5F9FF"/>
  <circle cx="345" cy="165" r="6" fill="#F5F9FF"/>
</svg>
