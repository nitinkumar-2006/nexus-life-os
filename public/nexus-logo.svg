<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Exact mark, pulled from the original approved widget's own saved
         SVG data (not redrawn/estimated) - a single flowing stroke,
         gradient sky blue to violet to pink, horizontal direction.
         Background is that same approved deep indigo, one lightness
         step up per explicit follow-up feedback (#1E1B4B -> #332D75) -
         nothing else about the mark changed. -->
    <linearGradient id="markGrad" x1="151.7" y1="256" x2="360.3" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
    <clipPath id="tileClip">
      <rect x="52" y="52" width="408" height="408" rx="96"/>
    </clipPath>
  </defs>

  <!-- Canvas background: intentionally none. Fully transparent, so this
       drops cleanly into any OS's own icon mask (circle, squircle,
       rounded square) without ever showing a seam. -->

  <rect x="52" y="52" width="408" height="408" rx="96" fill="#332D75"/>
  <g clip-path="url(#tileClip)">
    <path d="M151.7,360.3 C151.7,165.3 256,165.3 256,256 C256,346.7 360.3,346.7 360.3,165.3"
      fill="none" stroke="url(#markGrad)" stroke-width="41" stroke-linecap="round"/>
  </g>
</svg>
